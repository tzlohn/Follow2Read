<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DW Learning Tool</title>
  <style>
    body { margin:0; font-family:Arial; height:100vh; display:flex; flex-direction:column; }

    #topBar { padding:10px; background:#111; display:flex; gap:10px; }
    #topBar input { flex:1; padding:8px; }

    #main { flex:1; display:flex; }

    #left { width:50%; display:flex; flex-direction:column; border-right:1px solid #ccc; }
    #leftTop { flex:1; background:black; color:white; display:flex; align-items:center; justify-content:center; }
    #leftBottom { flex:1; padding:10px; border-top:1px solid #ccc; }

    #right { width:50%; display:flex; flex-direction:column; }
    #rightTop { flex:1; }

    iframe { width:100%; height:100%; border:none; }
  </style>
</head>
<body>

<div id="topBar">
  <input id="urlInput" placeholder="Paste DW link here" />
  <button onclick="loadDW()">Load</button>
</div>

<div id="main">

  <div id="left">
    <div id="leftTop">Video area</div>

    <div id="leftBottom">
      <button onclick="startRecording()">🎙 Start</button>
      <button onclick="stopRecording()">⏹ Stop</button>
      <audio id="audioPlayback" controls></audio>
    </div>
  </div>

  <div id="right">
    <div id="rightTop">
      <!-- PDF 會顯示在這裡 -->
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
