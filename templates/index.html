<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Interactive App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .top-bar {
            padding: 10px;
            background: #f0f0f0;
        }

        .top-bar input {
            width: 70%;
            padding: 8px;
        }

        .top-bar button {
            padding: 8px;
        }

        /* 🔄 Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ccc;
            border-top: 3px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            display: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        .right {
            width: 50%;
            padding: 10px;
        }

        .left-top {
            flex: 2;
            padding: 10px;
        }

        .left-bottom {
            flex: 1;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        iframe {
            width: 100%;
            height: 300px;
        }

        #pdfViewer {
            width: 100%;
            height: 90%;
            border: none;
        }

        .timestamps button {
            display: block;
            margin: 5px 0;
        }

        /* 🎤 波形畫布 */
        #waveCanvas {
            width: 100%;
            height: 80px;
            background: #111;
            display: none;
        }

        .record-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 小波形 */
        #waveCanvas {
            width: 150px;
            height: 40px;
            background: #111;
            display: none;
            border-radius: 4px;
        }

        /* 錄音清單 */
        .record-item {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }        
    </style>
</head>

<body>

<div class="top-bar">
    <input id="urlInput" placeholder="貼上 YouTube 或 DW URL">
    <button onclick="getPDF()">顯示 PDF</button>
    <div id="loadingSpinner" class="spinner"></div>
</div>

<div class="container">

    <div class="left">

        <div class="left-top">
            <div id="player"></div>

            <button onclick="recordTime()">記錄時間</button>
            <div class="timestamps" id="timestamps"></div>
        </div>

        <div class="left-bottom">
            <h3>錄音功能</h3>

            <div class="record-bar">
                <button onclick="startRecording()">開始</button>
                <button onclick="stopRecording()">停止</button>

                <!-- 小波形 -->
                <canvas id="waveCanvas"></canvas>
            </div>

            <!-- 🎧 錄音列表 -->
            <div id="recordingsList"></div>
        </div>

    </div>

    <div class="right">
        <h3>PDF 顯示區</h3>
        <iframe id="pdfViewer"></iframe>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '300',
        width: '100%',
        videoId: ''
    });
}

function extractVideoID(url) {
    const regExp = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
    const match = url.match(regExp);
    return match ? match[1] : null;
}

function recordTime() {
    const time = Math.floor(player.getCurrentTime());

    const btn = document.createElement("button");
    btn.innerText = "跳到 " + time + " 秒";

    btn.onclick = () => player.seekTo(time, true);

    document.getElementById("timestamps").appendChild(btn);
}

/* 🎤 錄音 + 波形 */
let mediaRecorder;
let audioChunks = [];
let audioContext;
let analyser;
let dataArray;
let animationId;
let recordingCount = 0;

async function startRecording() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    source.connect(analyser);

    analyser.fftSize = 1024;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("waveCanvas");
    canvas.style.display = "block";
    const ctx = canvas.getContext("2d");

    function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);

        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#00ff88";

        ctx.beginPath();

        let sliceWidth = canvas.width / dataArray.length;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
            let v = dataArray[i] / 128.0;
            let y = v * canvas.height / 2;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);

            x += sliceWidth;
        }

        ctx.stroke();
    }

    draw();

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.onstop = () => {
        cancelAnimationFrame(animationId);
        canvas.style.display = "none";

        const blob = new Blob(audioChunks, { type: "audio/webm" });
        const url = URL.createObjectURL(blob);

        addRecording(url);
    };

    mediaRecorder.start();
}

function stopRecording() {
    if (mediaRecorder) mediaRecorder.stop();
}

/* ➕ 新增錄音項目 */
function addRecording(url) {
    recordingCount++;

    const container = document.getElementById("recordingsList");

    const div = document.createElement("div");
    div.className = "record-item";

    div.innerHTML = `
        <b>錄音 ${recordingCount}</b><br>
        <audio controls src="${url}"></audio><br>
        <a href="${url}" download="recording_${recordingCount}.webm">
            下載
        </a>
    `;

    container.prepend(div);
}

/* 📄 PDF + YouTube */
async function getPDF() {
    const spinner = document.getElementById("loadingSpinner");
    spinner.style.display = "inline-block";

    const url = document.getElementById("urlInput").value;

    try {
        const res = await fetch("/api/get_dom", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url })
        });

        const data = await res.json();
        console.log(data);

        if (data.pdf_url) {
            document.getElementById("pdfViewer").src =
                "https://docs.google.com/gview?url=" + data.pdf_url + "&embedded=true";
        }

        if (data.video_url) {
            const videoId = extractVideoID(data.video_url);
            if (videoId) player.loadVideoById(videoId);
        }

        if (!data.video_url && !data.pdf_url) {
            alert("沒有找到內容");
        }

    } catch (e) {
        alert("發生錯誤");
    }

    spinner.style.display = "none";
}
</script>

</body>
</html>
