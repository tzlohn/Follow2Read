<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DW Parser Tool</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .top {
            padding: 10px;
            background: #f2f2f2;
        }

        .top input {
            width: 70%;
            padding: 8px;
        }

        .top button {
            padding: 8px;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .left, .right {
            width: 50%;
            padding: 10px;
            overflow: auto;
        }

        .box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        #htmlBox {
            height: 70vh;
            overflow: auto;
            white-space: pre-wrap;
            background: #111;
            color: #0f0;
            font-size: 12px;
        }

        a {
            word-break: break-all;
        }
    </style>
</head>

<body>

<!-- 🔝 URL -->
<div class="top">
    <input id="urlInput" placeholder="貼上 DW URL">
    <button onclick="analyze()">解析</button>
</div>

<div class="container">

    <!-- 左邊 -->
    <div class="left">

        <div class="box">
            <h3>PDF 下載連結</h3>
            <div id="pdfBox">尚未載入</div>
        </div>

        <div class="box">
            <h3>操作</h3>
            <button onclick="downloadPDF()">下載 PDF</button>
        </div>

    </div>

    <!-- 右邊 -->
    <div class="right">
        <div class="box">
            <h3>HTML / DOM（F12內容）</h3>
            <div id="htmlBox"></div>
        </div>
    </div>

</div>

<script>
let pdfUrl = "";
let htmlData = "";

/* 🔥 主功能 */
async function analyze() {
    const url = document.getElementById("urlInput").value;

    const res = await fetch("/api/get_dom", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ url })
    });

    const data = await res.json();

    pdfUrl = data.pdf_url || "";
    htmlData = data.html || "";

    // PDF 顯示
    document.getElementById("pdfBox").innerHTML =
        pdfUrl ? `<a href="${pdfUrl}" target="_blank">${pdfUrl}</a>` : "找不到 PDF";

    // HTML 顯示（截斷避免爆炸）
    document.getElementById("htmlBox").innerText =
        htmlData.substring(0, 50000);
}

/* 📥 PDF 下載 */
function downloadPDF() {
    if (!pdfUrl) {
        alert("沒有 PDF");
        return;
    }
    window.open(pdfUrl, "_blank");
}
</script>

</body>
</html>
