<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DW DOM Viewer</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .top {
            padding: 10px;
            background: #f0f0f0;
        }

        .top input {
            width: 70%;
            padding: 8px;
        }

        .top button {
            padding: 8px;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .left, .right {
            width: 50%;
            padding: 10px;
            overflow: auto;
        }

        .box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        #htmlBox {
            white-space: pre-wrap;
            background: #111;
            color: #0f0;
            height: 65vh;
            overflow: auto;
            font-size: 12px;
        }

        a {
            word-break: break-all;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- 🔝 URL 輸入 -->
<div class="top">
    <input id="urlInput" placeholder="貼上 DW URL">
    <button onclick="analyze()">解析 DOM</button>
</div>

<div class="container">

    <!-- 左 -->
    <div class="left">

        <div class="box">
            <h3>PDF 下載</h3>
            <div id="pdfBox">尚未解析</div>
        </div>

        <div class="box">
            <button onclick="openPDF()">開啟 PDF</button>
        </div>

    </div>

    <!-- 右 -->
    <div class="right">

        <div class="box">
            <h3>F12 DOM（Playwright）</h3>
            <div id="htmlBox">尚未載入</div>
        </div>

    </div>

</div>

<script>

let pdfUrl = "";
let htmlData = "";

/* 🔥 主功能 */
async function analyze() {
    const url = document.getElementById("urlInput").value;

    document.getElementById("pdfBox").innerText = "loading...";
    document.getElementById("htmlBox").innerText = "loading...";

    try {
        const res = await fetch("/api/get_dom", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url })
        });

        const data = await res.json();

        console.log("RESPONSE:", data);

        if (data.status !== "ok") {
            alert("Error: " + data.message);
            return;
        }

        // PDF
        pdfUrl = data.pdf_url;

        if (pdfUrl) {
            document.getElementById("pdfBox").innerHTML =
                `<a href="${pdfUrl}" target="_blank">${pdfUrl}</a>`;
        } else {
            document.getElementById("pdfBox").innerText = "找不到 PDF";
        }

        // DOM
        htmlData = data.html;

        document.getElementById("htmlBox").innerText =
            htmlData.substring(0, 80000); // 避免爆 UI

    } catch (err) {
        alert("fetch error: " + err);
    }
}


/* 📄 打開 PDF */
function openPDF() {
    if (!pdfUrl) {
        alert("沒有 PDF");
        return;
    }
    window.open(pdfUrl, "_blank");
}

</script>

</body>
</html>
