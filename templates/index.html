<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Interactive App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .top-bar {
            padding: 10px;
            background: #f0f0f0;
        }

        .top-bar input {
            width: 70%;
            padding: 8px;
        }

        .top-bar button {
            padding: 8px;
        }

        /* 🔄 Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ccc;
            border-top: 3px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            display: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        .right {
            width: 50%;
            padding: 10px;
        }

        .left-top {
            flex: 2;
            padding: 10px;
        }

        .left-bottom {
            flex: 1;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        iframe {
            width: 100%;
            height: 300px;
        }

        #pdfViewer {
            width: 100%;
            height: 90%;
            border: none;
        }

        .timestamps button {
            display: block;
            margin: 5px 0;
        }

        /* 🎤 波形畫布 */
        #waveCanvas {
            width: 100%;
            height: 80px;
            background: #111;
            display: none;
        }

        .record-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 小波形 */
        #waveCanvas {
            width: 150px;
            height: 40px;
            background: #111;
            display: none;
            border-radius: 4px;
        }

        /* 錄音清單 */
        .record-item {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }        
        .big-btn {
            font-size: 18px;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 時間點按鈕容器 */
        .time-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
        }

        /* 小控制按鈕 */
        .small-btn {
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        #newsSelect {
            font-size: 2em;
            padding: 8px;
            height: 30px;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <select id="newsSelect">
        <option>Loading...</option>
    </select>
    <button onclick="getPDF()">顯示 PDF</button>
    <div id="loadingSpinner" class="spinner"></div>
</div>

<div class="container">

    <div class="left">

        <div class="left-top">
            <div id="player"></div>

            <button class="big-btn" onclick="recordTime()">⏱️ 記錄時間</button>
            <div class="timestamps" id="timestamps"></div>
        </div>

        <div class="left-bottom">
            <h3>錄音功能</h3>

            <div class="record-bar">
                <button onclick="startRecording()">開始</button>
                <button onclick="stopRecording()">停止</button>

                <!-- 小波形 -->
                <canvas id="waveCanvas"></canvas>
            </div>

            <!-- 🎧 錄音列表 -->
            <div id="recordingsList"></div>
        </div>

    </div>

    <div class="right">
        <h3>PDF 顯示區</h3>
        <iframe id="pdfViewer"></iframe>
    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<!-- ========================= -->
<!-- 🎧 FFmpeg WASM -->
<!-- ========================= -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>

<script>
let player;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '300',
        width: '100%',
        videoId: ''
    });
}

function extractVideoID(url) {
    const regExp = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
    const match = url.match(regExp);
    return match ? match[1] : null;
}

function recordTime() {
    const time = Math.floor(player.getCurrentTime());

    const container = document.createElement("div");
    container.className = "time-item";

    // ▶ 跳轉按鈕
    const jumpBtn = document.createElement("button");
    jumpBtn.innerText = "▶ " + time + "s";
    jumpBtn.className = "small-btn";

    jumpBtn.onclick = () => {
        player.seekTo(time, true);

        // ⏱ 延遲 1 秒再播放
        setTimeout(() => {
            player.playVideo();
        }, 1000);
    };

    // ⏸ 暫停按鈕
    const pauseBtn = document.createElement("button");
    pauseBtn.innerText = "⏸";
    pauseBtn.className = "small-btn";

    pauseBtn.onclick = () => {
        player.pauseVideo();
    };

    container.appendChild(jumpBtn);
    container.appendChild(pauseBtn);

    document.getElementById("timestamps").appendChild(container);
}

/* =========================
   🎧 FFmpeg setup
========================= */
let ffmpeg = null;
let fetchFileFunc = null;
let ffmpegLoaded = false;

async function loadFFmpeg() {
    if (ffmpegLoaded) return;

    try {
        const FFmpegModule = window.FFmpeg;
        if (!FFmpegModule) throw new Error("FFmpeg not loaded");

        const { createFFmpeg, fetchFile } = FFmpegModule;

        ffmpeg = createFFmpeg({ log: false });
        fetchFileFunc = fetchFile;

        await ffmpeg.load();
        ffmpegLoaded = true;

        console.log("✅ FFmpeg loaded");
    } catch (e) {
        console.warn("⚠️ FFmpeg failed:", e);
        ffmpegLoaded = false;
    }
}


/* 🎤 錄音 + 波形 */
let mediaRecorder;
let audioChunks = [];
let audioContext;
let analyser;
let dataArray;
let animationId;
let recordingCount = 0;

async function startRecording() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    source.connect(analyser);

    analyser.fftSize = 1024;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("waveCanvas");
    canvas.style.display = "block";
    const ctx = canvas.getContext("2d");

    function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);

        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#00ff88";

        ctx.beginPath();

        let sliceWidth = canvas.width / dataArray.length;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
            let v = dataArray[i] / 128.0;
            let y = v * canvas.height / 2;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);

            x += sliceWidth;
        }

        ctx.stroke();
    }

    draw();

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.onstop = async () => {
        cancelAnimationFrame(animationId);
        document.getElementById("waveCanvas").style.display = "none";

        const webmBlob = new Blob(audioChunks, { type: "audio/webm" });
        const webmUrl = URL.createObjectURL(webmBlob);

        addRecording(webmUrl);

        // ✅ 先確保錄音一定正常
        audioChunks = [];

        // =========================
        // 🔥 MP3（安全模式）
        // =========================
        try {
            await loadFFmpeg();

            if (!ffmpegLoaded) return; // ❗ ffmpeg壞就跳過

            ffmpeg.FS("writeFile", "input.webm", await fetchFileFunc(webmBlob));

            await ffmpeg.run(
                "-i", "input.webm",
                "-b:a", "192k",
                "output.mp3"
            );

            const mp3Data = ffmpeg.FS("readFile", "output.mp3");

            const mp3Blob = new Blob([mp3Data.buffer], { type: "audio/mp3" });
            const mp3Url = URL.createObjectURL(mp3Blob);

            const a = document.createElement("a");
            a.href = mp3Url;
            a.download = `recording_${recordingCount}.mp3`;
            a.click();

        } catch (e) {
            console.warn("⚠️ MP3 轉換失敗:", e);
        }
    };

        mediaRecorder.start();
    }

function stopRecording() {
    if (mediaRecorder) mediaRecorder.stop();
}

/* ➕ 新增錄音項目 */
function addRecording(url) {
    recordingCount++;

    const container = document.getElementById("recordingsList");

    const div = document.createElement("div");
    div.className = "record-item";

    div.innerHTML = `
        <b>錄音 ${recordingCount}</b><br>
        <audio controls src="${url}"></audio><br>
        <a href="${url}" download="recording_${recordingCount}.webm">
            下載
        </a>
    `;

    container.prepend(div);
}

/* 📄 PDF + YouTube */
async function getPDF() {
    const spinner = document.getElementById("loadingSpinner");
    spinner.style.display = "inline-block";

    const url = document.getElementById("newsSelect").value;

    try {
        const res = await fetch("/api/get_dom", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url })
        });

        const data = await res.json();
        console.log(data);

        if (data.pdf_url) {
            document.getElementById("pdfViewer").src =
                "https://docs.google.com/gview?url=" + data.pdf_url + "&embedded=true";
        }

        if (data.video_url) {
            const videoId = extractVideoID(data.video_url);
            if (videoId) player.loadVideoById(videoId);
        }

        if (!data.video_url && !data.pdf_url) {
            alert("沒有找到內容");
        }

    } catch (e) {
        alert("發生錯誤");
    }

    spinner.style.display = "none";
}

window.onload = loadDWList;
document.addEventListener("DOMContentLoaded", loadDWList);

async function loadDWList() {
    try {

        console.log("🚀 loading DW list...");

        const res = await fetch("/api/list_dw");

        console.log("📡 response status:", res.status);

        const text = await res.text();   // 👈 先不要直接 json
        console.log("📦 RAW RESPONSE:", text);

        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            console.error("❌ JSON parse failed:", e);
            return;
        }

        console.log("✅ PARSED DATA:", data);

        const select = document.getElementById("newsSelect");
        if (!select) {
            console.error("❌ newsSelect not found in DOM");
            return;
        }

        select.innerHTML = "";

        data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.url;
            option.textContent = item.date;
            select.appendChild(option);
        });

        // 預設選第一個
        if (data.length > 0) {
            select.selectedIndex = 0;
        }

    } catch (err) {
        console.error(err);
    }
}
</script>

</body>
</html>
