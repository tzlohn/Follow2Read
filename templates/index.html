<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>小王子的跟屁蟲</title>

    <style>
        /* Base body styling */
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Top navigation bar */
        .top-bar {
            padding: 10px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Dropdown menu for news selection */
        .top-bar input {
            width: 70%;
            padding: 8px;
        }

        /* Top bar buttons */
        .top-bar button {
            padding: 8px 12px;
            height: 40px;
            font-size: 1em;
            vertical-align: middle;
        }

        /* Loading spinner animation */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ccc;
            border-top: 3px solid #333;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            display: none;
        }

        /* Spinner rotation animation */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Main container layout - flexbox for two-column layout */
        .container {
            display: flex;
            height: 100vh;
        }

        /* Left panel - video and timestamps */
        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        /* Right panel - PDF viewer */
        .right {
            width: 50%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Upper right section - PDF display */
        .right-top {
            flex: 3;
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            min-width: 0;
        }

        /* Lower right section - Text edit */
        .right-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            min-width: 0;
        }

        .container,
        .left,
        .right {
            min-width: 0;
        }

        /* Text edit area styling */
        .right-bottom h3 {
            margin: 10px 10px 5px 10px;
            font-size: 0.95em;
        }

        /* Textarea for text editing */
        #textEditor {
            flex: 1;
            margin: 0 10px 10px 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            resize: none;
        }

        /* Top section of left panel */
        .left-top {
            flex: 2;
            padding: 10px;
        }

        /* Bottom section of left panel */
        .left-bottom {
            flex: 1;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        /* Embedded video player */
        iframe {
            width: 100%;
            height: 300px;
        }

        /* Embedded PDF viewer */
        #pdfViewerContainer {
            flex: 1;
            background: #f7f7f7;
        }

        #pdfViewer {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .pdf-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }

        .pdf-controls button {
            padding: 6px 10px;
            font-size: 0.9em;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }

        .pdf-controls span {
            font-size: 0.9em;
        }

        .right-top h3 {
            margin: 10px 0 0 10px;
            font-size: 0.95em;
        }

        /* Timestamps list layout */
        .timestamps {
            display: grid;
            grid-template-rows: repeat(3, auto);
            grid-auto-flow: column;
            gap: 5px;
            max-width: 100%;
        }

        .timestamps .time-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
        }

        /* Waveform visualization canvas */
        #waveCanvas {
            width: 100%;
            height: 80px;
            background: #111;
            display: none;
        }

        /* Recording control bar layout */
        .record-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Small waveform during recording */
        #waveCanvas {
            width: 150px;
            height: 40px;
            background: #111;
            display: none;
            border-radius: 4px;
        }

        /* Individual recording item styling */
        .record-item {
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .recording-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .recording-row audio {
            flex: 1;
            min-width: 0;
        }

        .recording-row .small-btn {
            flex: 0 0 auto;
        }
        
        /* Large action buttons */
        .big-btn {
            font-size: 18px;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Timestamp item container */
        .time-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
        }

        /* Small control buttons */
        .small-btn {
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* News dropdown styling */
        #newsSelect {
            font-size: 1em;
            padding: 8px 12px;
            height: 40px;
            flex: 1;
            max-width: 300px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

        <div class="left-top">
            <div id="player"></div>

</div>

<script>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
// Global YouTube player instance
let player;
let playerReady = false;
let currentVideoId = null; // Track currently loaded video ID
let videoLoadRetryInterval = null; // Track retry interval

// PDF.js globals
let pdfDoc = null;
let pageNum = 1;
let pageRendering = false;
let pageNumPending = null;
let scale = 1.5;
let canvas = document.getElementById('pdfCanvas');
let ctx = canvas ? canvas.getContext('2d') : null;
let currentPdfUrl = null;
let pdfPageWatcher = null;

// Set PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

// Cookie functions
function setCookie(name, value, days = 30) {
    const expires = new Date();
    expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
}

function getCookie(name) {
    const nameEQ = name + '=';
    const ca = document.cookie.split(';');
    for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
    }
    return null;
}

// Check if YouTube API loaded successfully
window.onYouTubeIframeAPIReady = function() {
    console.log("YouTube IFrame API loaded successfully");
    initYouTubePlayer();
};

// Fallback check in case the API doesn't load
setTimeout(() => {
    console.log("=== YouTube API Status Check (10s) ===");
    if (typeof YT === 'undefined') {
        console.error("YouTube API failed to load within 10 seconds");
        console.log("Possible causes:");
        console.log("- Network connectivity issues");
        console.log("- Content Security Policy blocking YouTube");
        console.log("- Ad blocker or browser extension interference");
        console.log("- Firewall blocking YouTube domains");
        alert("YouTube API failed to load. Check:\n1. Internet connection\n2. Ad blockers\n3. Browser security settings\n4. Firewall settings");
    } else {
        console.log("✓ YouTube API is available");
        if (!playerReady && typeof initYouTubePlayer === 'function') {
            console.log("Manually initializing YouTube player...");
            initYouTubePlayer();
        }
    }
}, 10000);

// Initialize YouTube player when API is ready
function initYouTubePlayer() {
    console.log("=== YouTube Player Initialization ===");
    console.log("YouTube API ready, YT object:", typeof YT);
    console.log("Player element exists:", !!document.getElementById('player'));
    
    try {
        player = new YT.Player('player', {
            height: '300',
            width: '100%',
            videoId: 'UKWnzQfiv1E', // Fixed video ID that always loads
            events: {
                'onReady': function(event) {
                    console.log("✓ YouTube player ready");
                    playerReady = true;
                    currentVideoId = 'UKWnzQfiv1E'; // Track the loaded video
                    // Test basic functionality
                    console.log("Player methods available:", {
                        loadVideoById: typeof player.loadVideoById === 'function',
                        getPlayerState: typeof player.getPlayerState === 'function'
                    });
                    // Load saved timestamp from cookie
                    const savedTime = getCookie('youtubeTimestamp');
                    if (savedTime) {
                        const parsed = parseFloat(savedTime);
                        if (!isNaN(parsed)) {
                            player.seekTo(parsed, true);
                            console.log("Loaded YouTube timestamp from cookie:", parsed);
                        }
                    }
                    // Start auto-save interval for timestamp
                    setInterval(() => {
                        if (playerReady && player && typeof player.getCurrentTime === 'function') {
                            const currentTime = Math.floor(player.getCurrentTime());
                            setCookie('youtubeTimestamp', currentTime);
                        }
                    }, 5000);
                    window.addEventListener('beforeunload', () => {
                        if (playerReady && player && typeof player.getCurrentTime === 'function') {
                            setCookie('youtubeTimestamp', Math.floor(player.getCurrentTime()));
                        }
                    });
                    // Auto-load PDF when player is ready
                    console.log("Calling loadPdfDocument...");
                    loadPdfDocument();
                },
                'onError': function(event) {
                    console.error("✗ YouTube player error:", event.data);
                    handleYouTubeError(event.data);
                },
                'onStateChange': function(event) {
                    console.log("YouTube player state changed:", event.data);
                }
            }
        });
        console.log("✓ YouTube player object created");
    } catch (error) {
        console.error("✗ Error creating YouTube player:", error);
        alert("Failed to create YouTube player: " + error.message);
    }
}

// Handle YouTube API errors with detailed messages
function handleYouTubeError(errorCode) {
    let errorMessage = "";
    let suggestions = "";

    switch(errorCode) {
        case 2:
            errorMessage = "Invalid video ID or malformed video URL";
            suggestions = "Check if the video URL is correct";
            break;
        case 5:
            errorMessage = "HTML5 player error - video format not supported";
            suggestions = "Try a different video or browser";
            break;
        case 100:
            errorMessage = "Video not found or has been removed";
            suggestions = "The video may have been deleted or made private";
            break;
        case 101:
        case 150:
            errorMessage = "Video embedding disabled by the video owner";
            suggestions = "The video owner has disabled embedding. Try a different video";
            break;
        case 101:
            errorMessage = "Video embedding disabled by the video owner";
            suggestions = "The video owner has disabled embedding";
            break;
        default:
            errorMessage = "Unknown YouTube error: " + errorCode;
            suggestions = "Check YouTube's status or try again later";
    }

    console.error("YouTube Error Details:", {
        code: errorCode,
        message: errorMessage,
        suggestions: suggestions
    });

    // Show error to user
    const errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'background: #ffebee; border: 1px solid #f44336; padding: 10px; margin: 10px 0; border-radius: 4px;';
    errorDiv.innerHTML = `
        <strong>YouTube Error:</strong> ${errorMessage}<br>
        <strong>Suggestions:</strong> ${suggestions}<br>
        <small>Error Code: ${errorCode}</small>
    `;
    document.getElementById('player').appendChild(errorDiv);

    // Auto-remove error message after 10 seconds
    setTimeout(() => {
        if (errorDiv.parentNode) {
            errorDiv.parentNode.removeChild(errorDiv);
        }
    }, 10000);
}

// Extract video ID from various YouTube URL formats
// Supports: youtube.com/watch?v=ID and youtu.be/ID
function extractVideoID(url) {
    const regExp = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
    const match = url.match(regExp);
    return match ? match[1] : null;
}

// Debug functions for troubleshooting YouTube issues
// Show video loading error to user
function showVideoError(message) {
    // Clear any existing error messages
    const existingErrors = document.querySelectorAll('#player > div[style*="background: #ffebee"]');
    existingErrors.forEach(el => el.remove());

    const errorDiv = document.createElement('div');
    errorDiv.style.cssText = 'background: #ffebee; border: 1px solid #f44336; padding: 10px; margin: 10px 0; border-radius: 4px;';
    errorDiv.innerHTML = `
        <strong>Video Loading Error:</strong> ${message}<br>
        <small>Check the browser console for more details</small>
    `;
    document.getElementById('player').appendChild(errorDiv);

    // Auto-remove error message after 15 seconds
    setTimeout(() => {
        if (errorDiv.parentNode) {
            errorDiv.parentNode.removeChild(errorDiv);
        }
    }, 15000);
}

// Record the current timestamp and add it to the timestamps list
// Creates a button to jump to the timestamp and a pause button
function recordTime() {
    const time = Math.floor(player.getCurrentTime());
    
    // Save timestamp to cookie
    setCookie('youtubeTimestamp', time);

    const container = document.createElement("div");
    container.className = "time-item";

    // Create button to jump to the recorded time
    const jumpBtn = document.createElement("button");
    jumpBtn.innerText = "▶ " + time + "s";
    jumpBtn.className = "small-btn";

    // Jump button functionality: seek to time and wait before playing
    jumpBtn.onclick = () => {
        player.seekTo(time, true);

        // Delay 1 second before resuming playback
        setTimeout(() => {
            player.playVideo();
        }, 1000);
    };

    // Create pause button
    const pauseBtn = document.createElement("button");
    pauseBtn.innerText = "⏸";
    pauseBtn.className = "small-btn";

    // Pause button functionality
    pauseBtn.onclick = () => {
        player.pauseVideo();
    };

    container.appendChild(jumpBtn);
    container.appendChild(pauseBtn);

    document.getElementById("timestamps").appendChild(container);
}

/* 🎤 Audio Recording + Waveform Visualization */
let mediaRecorder; // Handles recording from microphone
let audioChunks = []; // Stores audio data chunks
let audioContext; // Web Audio API context for analysis
let analyser; // Analyser node for waveform data
let dataArray; // Array to hold frequency/time domain data
let animationId; // ID for animation frame
let recordingCount = 0; // Counter for numbering recordings
let isRecording = false; // Track recording state
let isPaused = false; // Track pause state
let startButton; // Reference to start/pause button

// Toggle recording start/pause
function toggleRecording() {
    if (!isRecording) {
        startRecording();
    } else if (isPaused) {
        resumeRecording();
    } else {
        pauseRecording();
    }
}

// Update the start/pause button text and state
function updateStartButton() {
    if (!startButton) {
        startButton = document.querySelector('button[onclick="toggleRecording()"]');
    }

    if (startButton) {
        if (!isRecording) {
            startButton.innerText = "開始";
        } else if (isPaused) {
            startButton.innerText = "開始";
        } else {
            startButton.innerText = "暫停";
        }
    }
}

// Pause the current recording
function pauseRecording() {
    if (mediaRecorder && isRecording && !isPaused) {
        mediaRecorder.pause();
        isPaused = true;
        updateStartButton();
    }
}

// Resume the paused recording
function resumeRecording() {
    if (mediaRecorder && isRecording && isPaused) {
        mediaRecorder.resume();
        isPaused = false;
        updateStartButton();
    }
}

// Start recording audio from microphone with waveform visualization
async function startRecording() {
    // Set up media recorder for direct AAC recording in the browser
    const aacMimeType = [
        "audio/aac",
        "audio/mp4;codecs=mp4a.40.2",
        "audio/mp4"
    ].find(type => MediaRecorder.isTypeSupported(type));

    if (!aacMimeType) {
        alert("This browser cannot record AAC directly. Try Safari or another browser with AAC MediaRecorder support.");
        return;
    }

    const aacExtension = aacMimeType.includes("mp4") ? "m4a" : "aac";

    // Request microphone access
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    audioContext = new AudioContext();
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    source.connect(analyser);

    analyser.fftSize = 1024;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    const canvas = document.getElementById("waveCanvas");
    canvas.style.display = "block";
    const ctx = canvas.getContext("2d");

    // Draw waveform continuously during recording
    function draw() {
        animationId = requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);

        // Clear canvas with dark background
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw green waveform
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "#00ff88";

        ctx.beginPath();

        let sliceWidth = canvas.width / dataArray.length;
        let x = 0;

        // Plot amplitude points
        for (let i = 0; i < dataArray.length; i++) {
            let v = dataArray[i] / 128.0;
            let y = v * canvas.height / 2;

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);

            x += sliceWidth;
        }

        ctx.stroke();
    }

    draw();

    mediaRecorder = new MediaRecorder(stream, { mimeType: aacMimeType });
    audioChunks = [];

    // Collect audio data
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    // Handle end of recording
    mediaRecorder.onstop = () => {
        cancelAnimationFrame(animationId);
        document.getElementById("waveCanvas").style.display = "none";

        // Create AAC blob directly in the browser
        const aacBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || aacMimeType });
        const aacUrl = URL.createObjectURL(aacBlob);

        // Add recording to UI list with direct AAC download
        const recordItem = addRecording(aacUrl, "Ready to download AAC");
        updateRecordingWithDownload(recordItem, aacUrl, aacExtension);

        audioChunks = [];
    };

    mediaRecorder.start();
    isRecording = true;
    isPaused = false;
    updateStartButton();
}

// Stop the current recording
function stopRecording() {
    if (mediaRecorder) {
        mediaRecorder.stop();
        isRecording = false;
        isPaused = false;
        updateStartButton();
    }
}

// Add a new recording to the recordings list with playback and status text
function addRecording(url, statusText = "Pending conversion...") {
    recordingCount++;

    const container = document.getElementById("recordingsList");

    const div = document.createElement("div");
    div.className = "record-item";

    div.innerHTML = `
        <b>Recording ${recordingCount}</b>
        <div class="recording-row">
            <audio controls src="${url}"></audio>
            <span class="status-text">${statusText}</span>
        </div>
    `;

    // Add new recording to top of list
    container.prepend(div);
    return div;
}

// Update recording item with download button when conversion succeeds
function updateRecordingWithDownload(recordItem, aacUrl, aacExtension) {
    const statusSpan = recordItem.querySelector('.status-text');
    if (statusSpan) {
        const downloadBtn = document.createElement("button");
        downloadBtn.innerText = "Download AAC";
        downloadBtn.className = "small-btn";
        downloadBtn.onclick = () => {
            const a = document.createElement("a");
            a.href = aacUrl;
            a.download = `recording_${recordingCount}.${aacExtension}`;
            a.click();
        };

        statusSpan.parentNode.replaceChild(downloadBtn, statusSpan);
    }
}

// Load PDF in the browser's embedded PDF viewer
function loadPdfDocument(pdfPath) {
    const path = pdfPath || './pdfs/DerKleinePrinz.pdf';
    const fullUrl = path.startsWith('/') || path.startsWith('http') 
        ? path 
        : window.location.origin + '/' + path.replace(/^\.\//, '');
    const savedPage = parseInt(getCookie('pdfPage'), 10);
    pageNum = Number.isInteger(savedPage) && savedPage > 0 ? savedPage : 1;
    currentPdfUrl = fullUrl.split('#')[0];
    
    console.log("Loading PDF from:", fullUrl);

    const pageInput = document.getElementById('pageInput');
    if (pageInput) {
        pageInput.value = pageNum;
    }

    const viewer = document.getElementById('pdfViewer');
    if (viewer) {
        viewer.src = currentPdfUrl + '#page=' + pageNum + '&toolbar=1&navpanes=0&view=FitH';
        startPdfPageWatcher(viewer);
    }
}

function savePdfPage(num) {
    const parsedPage = parseInt(num, 10);
    if (!Number.isInteger(parsedPage) || parsedPage < 1) return;
    pageNum = parsedPage;
    setCookie('pdfPage', pageNum);
}

function handlePdfPageKey(event) {
    if (event.key === 'Enter') {
        goToPage(event.target.value);
    }
}

function startPdfPageWatcher(viewer) {
    if (pdfPageWatcher) {
        clearInterval(pdfPageWatcher);
    }

    pdfPageWatcher = setInterval(() => {
        try {
            const hash = viewer.contentWindow.location.hash;
            const match = hash.match(/[?&#]page=(\d+)/);
            if (match) {
                const visiblePage = parseInt(match[1], 10);
                if (Number.isInteger(visiblePage) && visiblePage > 0 && visiblePage !== pageNum) {
                    savePdfPage(visiblePage);
                    const pageInput = document.getElementById('pageInput');
                    if (pageInput) {
                        pageInput.value = visiblePage;
                    }
                }
            }
        } catch (e) {
            clearInterval(pdfPageWatcher);
            pdfPageWatcher = null;
        }
    }, 1000);
}

window.addEventListener('beforeunload', () => {
    const pageInput = document.getElementById('pageInput');
    if (pageInput) {
        savePdfPage(pageInput.value);
    }
});

// Render a page of the PDF
function renderPage(num) {
    pageRendering = true;
    pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({scale: scale});

        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.width = viewport.width + 'px';
        canvas.style.height = viewport.height + 'px';

        const renderContext = {
            canvasContext: ctx,
            viewport: viewport
        };

        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
            pageRendering = false;
            if (pageNumPending !== null) {
                renderPage(pageNumPending);
                pageNumPending = null;
            }
        });
    });
    
    document.getElementById('pageNum').textContent = num;
    updateZoomLevel();
}

function updateZoomLevel() {
    const zoomText = document.getElementById('zoomLevel');
    if (zoomText) {
        zoomText.textContent = Math.round(scale * 100) + '%';
    }
}

function zoomIn() {
    scale = Math.min(scale + 0.25, 4);
    if (pdfDoc) queueRenderPage(pageNum);
}

function zoomOut() {
    scale = Math.max(scale - 0.25, 0.5);
    if (pdfDoc) queueRenderPage(pageNum);
}

function fitWidth() {
    if (!pdfDoc) return;
    pdfDoc.getPage(pageNum).then(function(page) {
        const viewport1 = page.getViewport({scale: 1});
        const containerWidth = document.getElementById('pdfViewerContainer').clientWidth - 20;
        scale = Math.max(0.5, containerWidth / viewport1.width);
        queueRenderPage(pageNum);
    });
}

// Queue rendering if another page is rendering
function queueRenderPage(num) {
    if (pageRendering) {
        pageNumPending = num;
    } else {
        renderPage(num);
    }
}

// Navigate to previous page
function prevPage() {
    if (pageNum <= 1) return;
    pageNum--;
    queueRenderPage(pageNum);
    setCookie('pdfPage', pageNum);
}

// Navigate to next page
function nextPage() {
    if (pageNum >= pdfDoc.numPages) return;
    pageNum++;
    queueRenderPage(pageNum);
    setCookie('pdfPage', pageNum);
}

// Go to specific page
function goToPage(num) {
    const parsedPage = parseInt(num, 10);
    if (!Number.isInteger(parsedPage) || parsedPage < 1) return;
    savePdfPage(parsedPage);

    const viewer = document.getElementById('pdfViewer');
    if (viewer && currentPdfUrl) {
        viewer.src = currentPdfUrl + '#page=' + pageNum + '&toolbar=1&navpanes=0&view=FitH';
        startPdfPageWatcher(viewer);
    }
}

// Fetch PDF and YouTube video for the selected news item
async function getPDF() {
    // Show loading spinner
    const spinner = document.getElementById("loadingSpinner");
    spinner.style.display = "inline-block";

    // Get selected URL from dropdown
    const url = document.getElementById("newsSelect").value;

    // Clear current video ID to allow loading new video
    currentVideoId = null;

    try {
        // Request content from backend API
        const res = await fetch("/api/get_dom", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url })
        });

        const data = await res.json();
        console.log("API Response:", data);
        console.log("Response status:", res.status);

        // Load PDF if available
        if (data.pdf_url) {
            loadPdfDocument(data.pdf_url);
        }

        // Load YouTube video if available
        const videoLinkDisplay = document.getElementById('videoLinkDisplay');
        if (data.video_url) {
            console.log("Video URL found:", data.video_url);
            if (videoLinkDisplay) {
                videoLinkDisplay.innerHTML = `<strong>Found YouTube link:</strong> <a href="${data.video_url}" target="_blank" rel="noreferrer">${data.video_url}</a>`;
            }
            const videoId = extractVideoID(data.video_url);
            console.log("Extracted video ID:", videoId);
            if (videoId) {
                // Clear any existing retry interval
                if (videoLoadRetryInterval) {
                    clearInterval(videoLoadRetryInterval);
                    videoLoadRetryInterval = null;
                }

                // Function to attempt loading the video
                const attemptLoad = () => {
                    if (playerReady && player && typeof player.loadVideoById === 'function') {
                        // Only load if this is a different video or no video is loaded
                        if (currentVideoId !== videoId) {
                            console.log("Player is ready, loading video with ID:", videoId);
                            try {
                                player.loadVideoById(videoId);
                                currentVideoId = videoId; // Mark this video as loaded
                                console.log("Video load command sent successfully");

                                // Check if video actually loads after 5 seconds
                                setTimeout(() => {
                                    try {
                                        const state = player.getPlayerState();
                                        console.log("Video state after 5s:", state);
                                        if (state === -1) {
                                            console.warn("Video failed to load - may be blocked or unavailable");
                                            showVideoError("Video failed to load. It may be unavailable, private, or embedding may be disabled.");
                                        } else if (state >= 0) {
                                            console.log("Video loaded successfully!");
                                        }
                                    } catch (error) {
                                        console.error("Error checking video load status:", error);
                                    }
                                }, 5000);

                            } catch (error) {
                                console.error("Error loading video:", error);
                                showVideoError("Error loading video: " + error.message);
                            }
                        } else {
                            console.log("Video already loaded:", videoId);
                        }
                        return true; // Success (player ready)
                    } else {
                        console.log("Player not ready yet. playerReady:", playerReady, "player exists:", !!player);
                        return false; // Not ready
                    }
                };

                // Try to load immediately
                if (!attemptLoad()) {
                    // If not ready, retry every second for up to 10 seconds
                    let retries = 0;
                    const maxRetries = 10;
                    videoLoadRetryInterval = setInterval(() => {
                        retries++;
                        console.log(`Video load retry attempt ${retries}/${maxRetries}`);
                        
                        if (attemptLoad()) {
                            console.log("Video loaded successfully on retry", retries);
                            clearInterval(videoLoadRetryInterval);
                            videoLoadRetryInterval = null;
                        } else if (retries >= maxRetries) {
                            console.error("Failed to load video after", maxRetries, "retries");
                            clearInterval(videoLoadRetryInterval);
                            videoLoadRetryInterval = null;
                        }
                    }, 1000);
                }
            } else {
                console.warn("Could not extract video ID from URL:", data.video_url);
                if (videoLinkDisplay) {
                    videoLinkDisplay.innerHTML = '<strong>Found YouTube link:</strong> (invalid video URL)';
                }
            }
        } else {
            console.log("No video URL in response");
            if (videoLinkDisplay) {
                videoLinkDisplay.innerHTML = '<strong>Found YouTube link:</strong> None';
            }
        }

        // Alert user if no content found
        if (!data.video_url && !data.pdf_url) {
            alert("No content found");
        }
    } catch (e) {
        alert("An error occurred");
    }

    // Hide loading spinner
    spinner.style.display = "none";
}

// Load list of news items from backend and populate the dropdown
async function loadDWList() {
    try {

        console.log("🚀 loading DW list...");

        // Request news list from backend API
        const res = await fetch("/api/list_dw");

        console.log("📡 response status:", res.status);

        // Parse response as text first to debug any issues
        const text = await res.text();
        console.log("📦 RAW RESPONSE:", text);

        // Attempt to parse JSON
        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            console.error("❌ JSON parse failed:", e);
            return;
        }

        console.log("✅ PARSED DATA:", data);

        // Get dropdown element
        const select = document.getElementById("newsSelect");
        if (!select) {
            console.error("❌ newsSelect not found in DOM");
            return;
        }

        // Clear existing options
        select.innerHTML = "";

        // Add each news item as an option
        data.forEach(item => {
            const option = document.createElement("option");
            option.value = item.url;
            option.textContent = item.date;
            select.appendChild(option);
        });

        // Select first item by default
        if (data.length > 0) {
            select.selectedIndex = 0;
            // Automatically load the latest news PDF and video
            console.log("📺 Automatically loading latest news...");
            await getPDF();
        }

    } catch (err) {
        console.error(err);
    }
}
