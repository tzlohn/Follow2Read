<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Interactive App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* 上方 URL 輸入 */
        .top-bar {
            padding: 10px;
            background: #f0f0f0;
        }

        .top-bar input {
            width: 80%;
            padding: 8px;
        }

        .top-bar button {
            padding: 8px;
        }

        /* 主體 */
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }

        /* 左右 */
        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        .right {
            width: 50%;
            padding: 10px;
        }

        /* 左邊上下 */
        .left-top {
            flex: 2;
            padding: 10px;
        }

        .left-bottom {
            flex: 1;
            padding: 10px;
            border-top: 1px solid #ccc;
        }

        iframe {
            width: 100%;
            height: 300px;
        }

        .timestamps button {
            display: block;
            margin: 5px 0;
        }
    </style>
</head>

<body>

<!-- 🔝 URL 輸入 -->
<div class="top-bar">
    <input id="urlInput" placeholder="貼上 YouTube 或 DW URL">
    <button onclick="loadVideo()">載入影片</button>
    <button onclick="getPDF()">抓 PDF</button>
</div>

<div class="container">

    <!-- 左 -->
    <div class="left">

        <!-- 左上 -->
        <div class="left-top">
            <div id="player"></div>

            <button onclick="recordTime()">記錄時間</button>

            <div class="timestamps" id="timestamps"></div>
        </div>

        <!-- 左下（錄音） -->
        <div class="left-bottom">
            <h3>錄音功能</h3>
            <button onclick="startRecording()">開始錄音</button>
            <button onclick="stopRecording()">停止錄音</button>
            <audio id="audioPlayback" controls></audio>
        </div>

    </div>

    <!-- 右 -->
    <div class="right">
        <h3>右側內容區（預留）</h3>
    </div>

</div>

<!-- YouTube API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '300',
            width: '100%',
            videoId: ''
        });
    }

    function extractVideoID(url) {
        const regExp = /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;
        const match = url.match(regExp);
        return match ? match[1] : null;
    }

    function loadVideo() {
        const url = document.getElementById("urlInput").value;
        const videoId = extractVideoID(url);

        if (videoId) {
            player.loadVideoById(videoId);
        } else {
            alert("無效的 YouTube URL");
        }
    }

    function recordTime() {
        const time = Math.floor(player.getCurrentTime());

        const btn = document.createElement("button");
        btn.innerText = "跳到 " + time + " 秒";

        btn.onclick = () => {
            player.seekTo(time, true);
        };

        document.getElementById("timestamps").appendChild(btn);
    }

    // 🎤 錄音功能
    let mediaRecorder;
    let audioChunks = [];

    async function startRecording() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks);
            const audioUrl = URL.createObjectURL(audioBlob);

            document.getElementById("audioPlayback").src = audioUrl;
            audioChunks = [];
        };

        mediaRecorder.start();
    }

    function stopRecording() {
        mediaRecorder.stop();
    }

    async function getPDF() {
    const url = document.getElementById("urlInput").value;
    
    if (!url) {
        alert("請先貼上 URL");
        return;
    }

    try {
        const res = await fetch("/api/get_dom", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (data.pdf_url) {
            // ✅ 彈出視窗
            alert("找到 PDF：\n" + data.pdf_url);

            // 或開新分頁（更好用）
            window.open(data.pdf_url, "_blank");
        } else {
            alert("找不到 PDF");
        }

    } catch (err) {
        alert("發生錯誤：" + err);
    }
    }
</script>

</body>
</html>
