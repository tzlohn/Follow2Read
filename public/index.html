<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DW Learning Tool</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial;
    }

    #left {
      width: 50%;
      background: black;
      display: flex;
      flex-direction: column;
    }

    #right {
      width: 50%;
      padding: 20px;
      overflow-y: auto;
    }

    #inputBar {
      padding: 10px;
      background: #111;
    }

    input {
      width: 80%;
      padding: 6px;
    }

    button {
      padding: 6px 10px;
    }

    video, iframe {
      width: 100%;
      height: 80%;
    }

    .sentence {
      cursor: pointer;
      margin-bottom: 10px;
      padding: 4px;
    }

    .sentence:hover {
      background: #eee;
    }
  </style>
</head>
<body>

<div id="left">
  <div id="inputBar">
    <input id="urlInput" placeholder="Paste DW link here" />
    <button onclick="loadPage()">Load</button>
  </div>

  <video id="video" controls style="display:none"></video>
  <iframe id="iframe" style="display:none; width:100%; height:80%;"></iframe>
</div>

<div id="right"></div>

<script src="script.js"></script>
</body>
</html>
