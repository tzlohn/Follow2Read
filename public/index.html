<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Learning Tool</title>
  <style>
    body { margin:0; display:flex; height:100vh; font-family:Arial; }
    #left { width:50%; background:black; display:flex; flex-direction:column; }
    #right { width:50%; padding:20px; overflow-y:auto; }
    #inputBar { padding:10px; background:#111; }
    input { width:80%; padding:6px; }
    button { padding:6px 10px; }
    iframe { width:100%; height:80%; }
    .sentence { cursor:pointer; margin-bottom:10px; padding:4px; }
    .sentence:hover { background:#eee; }
  </style>
</head>
<body>

<div id="left">
  <div id="inputBar">
    <input id="urlInput" placeholder="Paste YouTube link here" />
    <button onclick="loadVideo()">Load</button>
  </div>

  <iframe id="player" allowfullscreen></iframe>
</div>

<div id="right">
  <textarea id="textInput" style="width:100%;height:150px;"></textarea>

  <button onclick="processText()">Process</button>
  <button onclick="reSplit()">🔁 重新斷句</button>
  <button onclick="processText()">Process</button>
  <div id="sentences"></div>
</div>

<script src="script.js"></script>
</body>
</html>
