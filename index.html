<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 Player (JSON Version)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
    }
    .container {
      display: flex;
      width: 100%;
    }
    .left, .right {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }
    .left {
      border-right: 1px solid #ccc;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h2>Select MP3</h2>

      <select id="mp3Select">
        <option>Loading...</option>
      </select>

      <audio id="audioPlayer" controls></audio>
    </div>

    <div class="right">
      <h2>Right Panel</h2>
      <p>You can put anything here.</p>
    </div>
  </div>

  <script>
    const select = document.getElementById('mp3Select');
    const player = document.getElementById('audioPlayer');

    async function loadMP3List() {
      try {
        const response = await fetch('./mp3-list.json');

        if (!response.ok) {
          throw new Error('HTTP error ' + response.status);
        }

        const files = await response.json();

        // 清空選單
        select.innerHTML = '';

        // 預設選項
        const defaultOption = document.createElement('option');
        defaultOption.textContent = '-- Choose a file --';
        defaultOption.value = '';
        select.appendChild(defaultOption);

        // 加入 mp3
        files.forEach(file => {
          const option = document.createElement('option');
          option.value = './audio/' + file;
          option.textContent = file.replace('.mp3', '').replace(/_/g, ' ');
          select.appendChild(option);
        });

      } catch (error) {
        console.error('❌ JSON loading error:', error);
        select.innerHTML = '<option>❌ Failed to load mp3-list.json</option>';
      }
    }

    // 選擇後播放
    select.addEventListener('change', function () {
      const file = this.value;
      if (file) {
        player.src = file;
        player.load();
        player.play();
      }
    });

    // 初始化
    loadMP3List();
  </script>
</body>
</html>
