<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MP3 Player</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
    }
    .container {
      display: flex;
      width: 100%;
    }
    .left, .right {
      flex: 1;
      padding: 20px;
      box-sizing: border-box;
    }
    .left {
      border-right: 1px solid #ccc;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h2>Select MP3</h2>
      <select id="mp3Select">
        <option value="">-- Loading files... --</option>
      </select>

      <audio id="audioPlayer" controls>
        Your browser does not support the audio element.
      </audio>
    </div>

    <div class="right">
      <h2>Right Panel</h2>
      <p>You can put anything here.</p>
    </div>
  </div>

  <script>
    const select = document.getElementById('mp3Select');
    const player = document.getElementById('audioPlayer');

    // Fetch MP3 list from server
    async function loadMP3List() {
      try {
        const response = await fetch('/list-mp3');
        const files = await response.json();

        select.innerHTML = '<option value="">-- Choose a file --</option>';

        files.forEach(file => {
          const option = document.createElement('option');
          option.value = 'audio/' + file;
          option.textContent = file;
          select.appendChild(option);
        });
      } catch (err) {
        select.innerHTML = '<option>Error loading files</option>';
        console.error(err);
      }
    }

    select.addEventListener('change', function() {
      const selectedFile = this.value;
      if (selectedFile) {
        player.src = selectedFile;
        player.load();
        player.play();
      }
    });

    loadMP3List();
  </script>
</body>
</html>
