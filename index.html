<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聽寫跟讀小夥伴</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; height: 100vh; display: flex; }
    .container { display: flex; width: 100%; }
    .left { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
    .left-top, .left-bottom { padding: 16px; box-sizing: border-box; }
    .left-top { flex: 7; }
    .left-bottom { flex: 3; border-top: 1px solid #ccc; }
    .right { flex: 1; padding: 20px; }
    select { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 12px; }
    audio { width: 100%; margin-bottom: 12px; }
    button { padding: 8px 12px; cursor: pointer; margin-right: 8px; }
    ul { padding-left: 18px; }
    li { cursor: pointer; margin: 6px 0; }
    li:hover { text-decoration: underline; }
    .time { font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">

    <div class="left">

      <div class="left-top">
        <h2>選擇音檔</h2>

        <select id="mp3Select">
          <option>Loading...</option>
        </select>

        <audio id="audioPlayer" controls></audio>

        <button id="markBtn">按此紀錄斷句時間</button>

        <h3>斷句時間清單 (點擊可直接回放)</h3>
        <ul id="bookmarkList"></ul>
      </div>

      <div class="left-bottom">
        <h2>Recorder</h2>

        <button id="startRec">🎙 Start Recording</button>
        <button id="stopRec" disabled>⏹ Stop</button>

        <h3>Recordings</h3>
        <ul id="recordList"></ul>
      </div>

    </div>

    <div class="right">
      <h2>Right Panel</h2>
      <p>You can put anything here.</p>
    </div>

  </div>

  <script src="https://unpkg.com/lamejs@1.2.0/lame.min.js"></script>
  <script>
    const select = document.getElementById('mp3Select');
    const player = document.getElementById('audioPlayer');
    const markBtn = document.getElementById('markBtn');
    const bookmarkList = document.getElementById('bookmarkList');

    const startRec = document.getElementById('startRec');
    const stopRec = document.getElementById('stopRec');
    const recordList = document.getElementById('recordList');

    player.volume = 0.3;

    function convertFloatToInt16(buffer) {
      let l = buffer.length;
      let buf = new Int16Array(l);
      while (l--) {
        buf[l] = Math.min(1, buffer[l]) * 0x7fff;
      }
      return buf;
    }

    async function loadMP3List() {
      try {
        const response = await fetch('./mp3-list.json');
        const files = await response.json();

        select.innerHTML = '';

        const def = document.createElement('option');
        def.textContent = '-- Choose a file --';
        def.value = '';
        select.appendChild(def);

        files.forEach(file => {
          const option = document.createElement('option');
          option.value = './audio/' + file;
          option.textContent = file.replace('.mp3', '').replace(/_/g, ' ');
          select.appendChild(option);
        });

      } catch (e) {
        select.innerHTML = '<option>Error loading JSON</option>';
      }
    }

    select.addEventListener('change', function () {
      if (this.value) {
        player.src = this.value;
        player.play();
        bookmarkList.innerHTML = '';
      }
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    markBtn.addEventListener('click', () => {
      const t = player.currentTime;
      const li = document.createElement('li');
      li.innerHTML = `⏱ <span class="time">${formatTime(t)}</span>`;

      li.onclick = () => {
        player.currentTime = t;
        player.play();
      };

      bookmarkList.appendChild(li);
    });

    let mediaRecorder;
    let chunks = [];

    startRec.onclick = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      chunks = [];

      mediaRecorder.ondataavailable = e => chunks.push(e.data);

      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks);
        const arrayBuffer = await blob.arrayBuffer();

        // ✅ 改良 AudioContext（相容 + resume）
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();

        const audioBuffer = await new Promise((resolve, reject) => {
          audioContext.decodeAudioData(arrayBuffer, resolve, reject);
        });

        const samples = audioBuffer.getChannelData(0);
        const mp3encoder = new lamejs.Mp3Encoder(1, audioBuffer.sampleRate, 128);

        let mp3Data = [];
        const sampleBlockSize = 1152;

        for (let i = 0; i < samples.length; i += sampleBlockSize) {
          const sampleChunk = samples.subarray(i, i + sampleBlockSize);
          const mp3buf = mp3encoder.encodeBuffer(convertFloatToInt16(sampleChunk));
          if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }

        const mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) mp3Data.push(mp3buf);

        const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
        const url = URL.createObjectURL(mp3Blob);

        const li = document.createElement('li');

        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;

        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = '⬇ Download MP3';
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = url;
          a.download = `recording_${Date.now()}.mp3`; // ✅ 修正副檔名
          a.click();
        };

        li.appendChild(audio);
        li.appendChild(document.createElement('br'));
        li.appendChild(downloadBtn);

        // ❌ 刪除按鈕
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '🗑 Delete';
        deleteBtn.onclick = () => {
          if (confirm('確定要刪除這段錄音嗎？')) {
            URL.revokeObjectURL(url); // 釋放記憶體
            li.remove();
          }
        };

        li.appendChild(deleteBtn);

        recordList.appendChild(li);
      };

      mediaRecorder.start();

      startRec.disabled = true;
      stopRec.disabled = false;
    };

    stopRec.onclick = () => {
      mediaRecorder.stop();
      startRec.disabled = false;
      stopRec.disabled = true;
    };

    loadMP3List();
  </script>
</body>
</html>
